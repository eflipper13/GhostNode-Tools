[build-system]
requires = ["setuptools>=65", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostnode-tools"
version = "0.2.0"
description = "Read-only Ghost Core monitoring and local staking intelligence tools"
license = { file = "LICENSE" }
authors = [{ name = "eflipper13" }]
requires-python = ">=3.11"
dependencies = [
  "click>=8.1,<9",
  "fastapi>=0.100,<1",
  "httpx>=0.24,<1",
  "jinja2>=3.1,<4",
  "psutil>=5.8,<7",
  "uvicorn>=0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "pytest-asyncio>=0.21,<2"]

[project.scripts]
ghostnode = "ghostnode.cli:cli"

[tool.setuptools.packages.find]
include = ["ghostnode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
